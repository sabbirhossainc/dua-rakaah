<!-- The eight-pointed-star lattice of the style guide, drawn for this app. Used as a mask: only the shapes' opacity matters. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" stroke="#000" stroke-width="1.25">
  <!-- The star: two squares, one turned 45 degrees, around a circle. -->
  <path d="M34 34h28v28H34z"/>
  <path d="M48 28.2 67.8 48 48 67.8 28.2 48z"/>
  <circle cx="48" cy="48" r="7"/>
  <!-- Diagonals to the tile's corners; four tiles make a cross between the stars. -->
  <path d="M0 0 34 34M96 0 62 34M96 96 62 62M0 96l34-34"/>
</svg>
